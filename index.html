    <script>
      if (location.hostname === 'www.meongwol.co.kr') location.replace('https://meongwol.co.kr' + location.pathname + location.search + location.hash);
      // 미리보기 사이트(test.meongwol.co.kr)는 검색에 나오지 않게, 탭 이름에 [미리보기]
      if (location.hostname.startsWith('test.')) {
        var noIndex = document.createElement('meta');
        noIndex.name = 'robots';
        noIndex.content = 'noindex, nofollow';
        document.head.appendChild(noIndex);
        document.addEventListener('DOMContentLoaded', function () { document.title = '[미리보기] ' + document.title; });
      }
    </script>
